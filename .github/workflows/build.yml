name: build-apk
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pip install pillow
      - run: npm install
      - run: cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js && sed -i 's#<head>#<head><script src="capacitor.js"></script>#' www/index.html
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npx cap add android
      - run: python3 native/patch.py
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flanner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: flanner v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
